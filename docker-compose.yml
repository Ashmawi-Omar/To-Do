services:
  app:
    build: .
    volumes:
      - .:/var/www/html
      # Keep the heavy, frequently-read directories off the slow Windows bind mount.
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - sqlite-data:/data
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      LOG_CHANNEL: stderr
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 60

  web:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  vendor:
  storage:
  sqlite-data:
